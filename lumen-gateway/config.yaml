general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
litellm_settings:
  drop_params: true
router_settings:
  # Lumen models fail transiently now and then (429, 5xx, timeouts): retry on the same model.
  # No cross-model fallbacks: the turn, its usage and its "via" tag must name the model that answered.
  num_retries: 2
  retry_after: 2
