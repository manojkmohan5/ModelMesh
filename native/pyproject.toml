[project]
name = "modelmesh"
version = "0.1.0"
description = "ModelMesh built on Pydantic AI Harness, Temporal, and LiteLLM."
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai[temporal]==2.55.0",
    "openai==3.29.0",
    "pydantic-ai-harness[coder,skills,temporal]==0.55.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "cryptography>=44",
    "itsdangerous>=2.2,<3",
    "pillow>=12.3,<13",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.14",
    "pyright>=1.1",
]

[project.scripts]
modelmesh = "modelmesh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/src/modelmesh/static"]

[tool.hatch.build.targets.wheel]
packages = ["src/modelmesh"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "modelmesh/resources/skills"
"instructions.md" = "modelmesh/resources/instructions.md"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", ".."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pyright]
include = ["src"]
extraPaths = [".."]
typeCheckingMode = "standard"
