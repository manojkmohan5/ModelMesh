name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # pyright runs on Node.js.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Lint the app and its tests (project rules)
        working-directory: native
        run: uv run ruff check src tests
      - name: Lint the other Python (errors only)
        run: uv run ruff check --select F,E9 tests benchmarks laya
      - name: Type-check the app
        working-directory: native
        run: uv run pyright

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The package build test builds the web UI, so it needs Node.js and npm.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest native/tests tests -q -p no:cacheprovider

  web:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The API check regenerates the OpenAPI dump from the Python app.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: npm ci
      - name: Generated API client matches the Python API
        run: npm run api:check
      - run: npm run typecheck
      - name: UI unit tests
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:ui
